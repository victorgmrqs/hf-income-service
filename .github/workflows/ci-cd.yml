name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  quality:
    name: Quality (format + vet + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # golangci-lint only-new-issues precisa do histórico

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos não formatados (rode: gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint (só código novo do PR)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          only-new-issues: true

  docs-guard:
    name: Docs Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # docs-guard precisa do histórico para o diff contra o base

      - name: docs-guard
        run: bash scripts/docs-guard.sh origin/${{ github.base_ref }}

  build-and-push:
    name: Build & Push Image
    needs: [test, quality]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  gitops-update:
    name: GitOps Update
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Set environment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "GITOPS_BRANCH=main" >> $GITHUB_ENV
          else
            echo "ENV=homolog" >> $GITHUB_ENV
            echo "GITOPS_BRANCH=development" >> $GITHUB_ENV
          fi

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homelab-gitops
          token: ${{ secrets.GITOPS_UPDATE_PAT }}
          path: gitops
          ref: ${{ env.GITOPS_BRANCH }}

      - name: Update Image Tag
        run: |
          cd gitops/overlays/${{ env.ENV }}/hf-income-service
          sed -i "s|newTag:.*|newTag: ${{ needs.build-and-push.outputs.image_tag }}|g" kustomization.yaml

      - name: Commit and Push Changes
        run: |
          cd gitops
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "chore(gitops): update hf-income-service image to ${{ needs.build-and-push.outputs.image_tag }} in ${{ env.ENV }}"
            git push
          fi
