openapi: 3.0.3
info:
  title: HF Income Service API
  description: |
    Home Finance Income Service — manages income, monthly global budget ceiling,
    balance calculation, and spending reduction goals.

    Communicates with hf-transaction-service to retrieve expense totals and
    accounts payable for balance calculation.
  version: 1.0.0
  contact:
    name: Victor Gonçalves
    email: victor@goncalvesmarques.com

servers:
  - url: http://localhost:8081/api/v1
    description: Local development

tags:
  - name: income
    description: Income management (REC domain)
  - name: global-budget
    description: Monthly spending ceiling (ORC domain)
  - name: balance
    description: Monthly balance calculation (SAL domain)
  - name: reduction-goals
    description: Spending reduction goals (MET domain)

paths:
  # ─── Income ───────────────────────────────────────────────────────────────

  /income:
    post:
      tags: [income]
      summary: Create income
      operationId: createIncome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncomeRequest'
      responses:
        '201':
          description: Income created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIncome'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [income]
      summary: List incomes by user and competence
      operationId: listIncomes
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: competence
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-06' }
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncomeType'
      responses:
        '200':
          description: List of incomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIncomes'

  /income/propagate:
    post:
      tags: [income]
      summary: Propagate recurring incomes to next competence (REC-04)
      operationId: propagateIncomes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competence]
              properties:
                competence:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                  example: '2026-07'
      responses:
        '200':
          description: Propagated incomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIncomes'

  /income/{id}:
    get:
      tags: [income]
      summary: Get income by ID
      operationId: getIncomeById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: requester_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Income found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIncome'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [income]
      summary: Update income (applies from current competence forward — REC-03)
      operationId: updateIncome
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncomeRequest'
      responses:
        '200':
          description: Income updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseIncome'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [income]
      summary: Soft delete income
      operationId: deleteIncome
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: requester_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Income deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Global Budget ────────────────────────────────────────────────────────

  /budgets/global:
    post:
      tags: [global-budget]
      summary: Set global budget ceiling for a competence
      operationId: createGlobalBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGlobalBudgetRequest'
      responses:
        '201':
          description: Global budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGlobalBudget'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags: [global-budget]
      summary: Get global budget ceiling for a competence
      operationId: getGlobalBudget
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: competence
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Global budget found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGlobalBudget'
        '404':
          $ref: '#/components/responses/NotFound'

  /budgets/global/{id}:
    put:
      tags: [global-budget]
      summary: Manually update global budget ceiling (ORC-05)
      operationId: updateGlobalBudget
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceiling]
              properties:
                ceiling: { type: number, example: 4800.00 }
      responses:
        '200':
          description: Global budget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGlobalBudget'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /budgets/global/preview-next:
    get:
      tags: [global-budget]
      summary: Preview auto-adjustment for next month without applying (ORC-03/04)
      operationId: previewGlobalBudgetAutoAdjust
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Auto-adjustment preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAutoAdjustPreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /budgets/global/auto-adjust:
    post:
      tags: [global-budget]
      summary: Apply auto-adjustment for target competence (ORC-03/04/05)
      operationId: applyGlobalBudgetAutoAdjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, competence]
              properties:
                user_id: { type: string, format: uuid }
                # Competência de DESTINO do ajuste; a base é a competência anterior (FDD-002 §4/§5).
                competence: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-07' }
      responses:
        '200':
          description: Global budget auto-adjusted for the target competence (idempotent upsert)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGlobalBudget'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  # ─── Balance ──────────────────────────────────────────────────────────────

  /balance:
    get:
      tags: [balance]
      summary: Get full monthly balance for user (SAL-01/02/03/04)
      operationId: getBalance
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: competence
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Monthly balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBalance'

  # ─── Reduction Goals ──────────────────────────────────────────────────────

  /goals/reduction:
    post:
      tags: [reduction-goals]
      summary: Create a reduction goal for a category (MET-04)
      operationId: createReductionGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReductionGoalRequest'
      responses:
        '201':
          description: Reduction goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReductionGoal'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags: [reduction-goals]
      summary: List reduction goals for user/competence
      operationId: listReductionGoals
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: competence
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: List of reduction goals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReductionGoals'

  /goals/reduction/comparison:
    get:
      tags: [reduction-goals]
      summary: Get comparison — current vs goal vs previous month (MET-05/07)
      operationId: getReductionGoalComparison
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: competence
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Goal comparison by category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGoalComparison'

  /goals/reduction/{id}:
    put:
      tags: [reduction-goals]
      summary: Update reduction goal
      operationId: updateReductionGoal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_amount: { type: number, example: 350.00 }
      responses:
        '200':
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReductionGoal'

    delete:
      tags: [reduction-goals]
      summary: Delete reduction goal
      operationId: deleteReductionGoal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: requester_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Goal deleted

# ─── Components ──────────────────────────────────────────────────────────────

components:
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists for this competence
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamUnavailable:
      description: hf-transaction-service unavailable (code UPSTREAM_UNAVAILABLE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        data: { type: 'null' }
        error:
          type: object
          properties:
            code: { type: string, example: 'VALIDATION_ERROR' }
            message: { type: string, example: 'amount must be greater than zero' }

    IncomeType:
      type: string
      enum: [SALARY, FREELANCE, INVESTMENT, RENTAL, OTHER]

    Income:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        description: { type: string }
        amount: { type: number }
        type:
          $ref: '#/components/schemas/IncomeType'
        date: { type: string, format: date }
        competence: { type: string, pattern: '^\d{4}-\d{2}$' }
        recurrent: { type: boolean }
        origin_id: { type: string, format: uuid, nullable: true }

    CreateIncomeRequest:
      type: object
      required: [user_id, description, amount, type, date, competence, recurrent]
      properties:
        user_id: { type: string, format: uuid }
        description: { type: string, maxLength: 200 }
        amount: { type: number, minimum: 0.01 }
        type:
          $ref: '#/components/schemas/IncomeType'
        date: { type: string, format: date }
        competence: { type: string, pattern: '^\d{4}-\d{2}$' }
        recurrent: { type: boolean, default: false }

    UpdateIncomeRequest:
      type: object
      required: [requester_id]
      properties:
        requester_id: { type: string, format: uuid }
        description: { type: string }
        amount: { type: number, minimum: 0.01 }
        recurrent: { type: boolean }

    ApiResponseIncome:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Income' }
        error: { type: 'null' }

    ApiResponseIncomes:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Income'
        error: { type: 'null' }

    GlobalBudget:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        competence: { type: string, pattern: '^\d{4}-\d{2}$' }
        ceiling: { type: number }
        auto_adjusted: { type: boolean }
        created_at: { type: string, format: date-time }

    CreateGlobalBudgetRequest:
      type: object
      required: [user_id, competence, ceiling]
      properties:
        user_id: { type: string, format: uuid }
        competence: { type: string, pattern: '^\d{4}-\d{2}$' }
        ceiling: { type: number, minimum: 0.01 }

    ApiResponseGlobalBudget:
      type: object
      properties:
        data: { $ref: '#/components/schemas/GlobalBudget' }
        error: { type: 'null' }

    AutoAdjustPreview:
      type: object
      properties:
        current_competence: { type: string }
        current_ceiling: { type: number }
        current_spending: { type: number }
        next_competence: { type: string }
        suggested_ceiling: { type: number }
        adjustment_reason:
          type: string
          # Sem teto anterior o preview retorna 400 NO_PREVIOUS_BUDGET (FDD-002 §6) — não há reason "no_previous_data".
          enum: [spending_below_ceiling, spending_equals_ceiling]

    ApiResponseAutoAdjustPreview:
      type: object
      properties:
        data: { $ref: '#/components/schemas/AutoAdjustPreview' }
        error: { type: 'null' }

    Balance:
      type: object
      properties:
        competence: { type: string, pattern: '^\d{4}-\d{2}$' }
        total_income: { type: number }
        total_expenses: { type: number }
        balance_today: { type: number }
        committed_bills: { type: number }
        projected_balance: { type: number }
        global_ceiling: { type: number, nullable: true }
        ceiling_usage_pct: { type: number, nullable: true }
        projected_ceiling_usage_pct: { type: number, nullable: true }
        is_projected_negative: { type: boolean }

    ApiResponseBalance:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Balance' }
        error: { type: 'null' }

    ReductionGoal:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        competence: { type: string, pattern: '^\d{4}-\d{2}$' }
        target_amount: { type: number }
        previous_amount: { type: number }
        achieved: { type: boolean, nullable: true }

    CreateReductionGoalRequest:
      type: object
      required: [user_id, category_id, competence, target_amount]
      properties:
        user_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        competence: { type: string, pattern: '^\d{4}-\d{2}$' }
        target_amount: { type: number, minimum: 0.01 }

    ApiResponseReductionGoal:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ReductionGoal' }
        error: { type: 'null' }

    ApiResponseReductionGoals:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReductionGoal'
        error: { type: 'null' }

    GoalComparisonItem:
      type: object
      properties:
        category_id: { type: string, format: uuid }
        category_name: { type: string }
        previous_month_amount: { type: number }
        current_month_amount: { type: number }
        target_amount: { type: number }
        on_track: { type: boolean }
        variation_pct: { type: number, description: 'Negative = reduced spending' }
        variation_label: { type: string, example: '22,5% menor que o mês passado' }
        target_progress_pct: { type: number, description: 'current/target * 100' }

    ApiResponseGoalComparison:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GoalComparisonItem'
        error: { type: 'null' }
